services:
  bot:
    build: .
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_HOSTNAME: 'redis'
      REDIS_PORT: 6379
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  redis:
    image: "redis:7.0.9-alpine"
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - "./redis_data:/data"
      - "./redis/redis.conf:/usr/local/etc/redis/redis.conf"
